[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-records-scribe"
version = "2.0.0"
description = "Transparent extraction manifests for public records and government documents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Civic Records Scribe contributors" }]
keywords = ["ai", "agents", "governance", "safety", "open-source"]

[project.scripts]
"civic-records-scribe" = "civic_records_scribe.cli:main"

[project.urls]
Homepage = "https://sdevkota.github.io/civic-records-scribe/"
Repository = "https://github.com/sdevkota/civic-records-scribe"
Issues = "https://github.com/sdevkota/civic-records-scribe/issues"

[tool.setuptools.packages.find]
where = ["src"]
